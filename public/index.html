<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Sistema de Órdenes de Trabajo</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { color-scheme: light dark; }
        body.light-theme {
            --surface-0: #f8f9fa;
            --surface-1: #ffffff;
            --surface-2: #f0f2f5;
            --text-primary: #1a1d23;
            --text-secondary: #4a4f57;
            --text-muted: #8b92a0;
            --border: #d0d5dd;
            --fill-accent: #0066cc;
            --fill-accent-dark: #0052a3;
            --on-accent: #ffffff;
            --fill-success: #1e7e34;
            --on-success: #ffffff;
            --fill-danger: #d1293a;
            --on-danger: #ffffff;
            --bg-accent: #e3f2fd;
            --bg-success: #ecf5e9;
            --bg-danger: #ffebee;
            --bg-warning: #fff8e1;
        }
        body.dark-theme {
            --surface-0: #0d1117;
            --surface-1: #161b22;
            --surface-2: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --border: #30363d;
            --fill-accent: #1f6feb;
            --fill-accent-dark: #1960e8;
            --on-accent: #ffffff;
            --fill-success: #238636;
            --on-success: #ffffff;
            --fill-danger: #da3633;
            --on-danger: #ffffff;
            --bg-accent: #0d47a1;
            --bg-success: #1b4620;
            --bg-danger: #3d2626;
            --bg-warning: #3d3000;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--surface-0); color: var(--text-primary); line-height: 1.6; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 100%; width: 100%; }
        .login-screen { min-height: 100vh; padding: 2rem 1rem; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--surface-1); border-radius: 12px; padding: 2rem; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
        .login-card h1 { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 0.5rem; color: var(--fill-accent); }
        .login-card p { text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-size: 14px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-primary); font-weight: 500; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--surface-1); color: var(--text-primary); }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--fill-accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
        .login-btn:hover:not(:disabled) { opacity: 0.9; }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message { color: var(--fill-danger); font-size: 12px; margin-bottom: 12px; }
        .credentials-info { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .credentials-info p { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .credentials-list { font-size: 11px; color: var(--text-muted); }
        .credentials-list p { margin: 4px 0; }
        .dashboard { min-height: 100vh; background: var(--surface-0); }
        .header { background: var(--surface-1); border-bottom: 1px solid var(--border); padding: 1rem; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 44px; height: 44px; border-radius: 8px; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 18px; flex-shrink: 0; }
        .header-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
        .header-user { display: flex; flex-direction: column; }
        .header-user h2 { font-size: 15px; font-weight: 600; margin: 0; }
        .header-user p { font-size: 12px; color: var(--text-secondary); margin: 2px 0 0 0; }
        .header-right { display: flex; gap: 8px; align-items: center; }
        .theme-toggle { padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text-primary); transition: all 0.2s; }
        .theme-toggle:hover { background: var(--bg-accent); }
        .logout-btn { padding: 8px 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--text-primary); transition: all 0.2s; }
        .logout-btn:hover { background: var(--surface-2); }
        .nav-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
        .nav-btn { padding: 8px 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.2s; color: var(--text-primary); }
        .nav-btn:hover { background: var(--surface-2); }
        .nav-btn.active { background: var(--fill-accent); color: white; border-color: var(--fill-accent); }
        .content { padding: 1rem; }
        .section-title { font-size: 20px; font-weight: 600; margin-bottom: 1.5rem; color: var(--text-primary); }
        .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
        .card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .card-text { font-size: 12px; color: var(--text-secondary); margin: 4px 0; }
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 1.5rem; }
        .metric-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; }
        .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .metric-value { font-size: 24px; font-weight: 700; color: var(--fill-accent); }
        textarea { resize: vertical; min-height: 80px; }
        .btn { padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: var(--fill-accent); color: white; }
        .btn-primary:hover { background: var(--fill-accent-dark); }
        .btn-success { background: var(--fill-success); color: white; }
        .btn-success:hover { opacity: 0.9; }
        .btn-danger { background: var(--fill-danger); color: white; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
        .btn-secondary:hover { background: var(--surface-2); }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 1rem; }
        .list { display: grid; gap: 12px; }
        .list-item { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
        .list-item:hover { border-color: var(--fill-accent); }
        .list-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .empty-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
        .badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 500; }
        .badge.correctivo { background: var(--bg-danger); color: var(--fill-danger); }
        .badge.preventivo { background: var(--bg-success); color: var(--fill-success); }
        .badge.obra { background: var(--bg-warning); color: #b8860b; }
        .badge.admin { background: var(--bg-accent); color: var(--fill-accent); }
        .badge.supervisor { background: #e8f0ff; color: #0052a3; }
        .badge.tecnico { background: #f0f0f0; color: #666; }
        @media (max-width: 768px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } .nav-tabs { grid-template-columns: repeat(2, 1fr); } }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn-excel { background: #1e7e34; color: white; display: inline-flex; align-items: center; gap: 4px; }
        .btn-excel:hover { opacity: 0.9; }
        .btn-import { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-primary); }
        .file-input-hidden { display: none; }
        .breadcrumb-path { font-size: 11px; color: var(--text-muted); margin: 2px 0; }
        .select-disabled { opacity: 0.5; cursor: not-allowed; }
        .import-summary { background: var(--bg-accent); border-radius: 8px; padding: 10px; font-size: 12px; margin-top: 8px; color: var(--text-primary); }
        .checklist-section { margin-bottom: 1.25rem; }
        .checklist-section-title { font-size: 13px; font-weight: 700; color: var(--fill-accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 2px solid var(--border); }
        .insp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .insp-table th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-weight: 600; }
        .insp-table td { padding: 6px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .insp-radio-group { display: flex; gap: 10px; align-items: center; }
        .insp-radio-group label { display: flex; align-items: center; gap: 3px; font-size: 11px; white-space: nowrap; }
        .insp-obs-input { min-width: 90px; }
        .grid-table-wrap { overflow-x: auto; }
        .grid-table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 500px; }
        .grid-table th, .grid-table td { border: 1px solid var(--border); padding: 4px; text-align: center; }
        .grid-table th { background: var(--surface-2); font-weight: 600; }
        .grid-table select { font-size: 11px; padding: 4px; }
        .dyn-row { display: grid; gap: 6px; padding: 8px; background: var(--surface-2); border-radius: 8px; margin-bottom: 6px; }
        .dyn-row-actions { display: flex; justify-content: flex-end; }
        .btn-remove-row { background: var(--bg-danger); color: var(--fill-danger); font-size: 11px; padding: 4px 8px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-add-row { background: var(--bg-success); color: var(--fill-success); font-size: 12px; padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; margin-top: 4px; }
        .tipo-filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
        .tipo-filter-btn { padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); font-size: 11px; cursor: pointer; }
        .tipo-filter-btn.active { background: var(--fill-accent); color: white; border-color: var(--fill-accent); }
        .badge.guardia { background: var(--bg-warning); color: #b8860b; }
        .readonly-view { font-size: 12px; }
        .readonly-view .rv-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
        .readonly-view .rv-label { color: var(--text-secondary); }
        .readonly-view .rv-value { font-weight: 600; text-align: right; }
    </style>
</head>
<body class="light-theme">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext } = React;
        const API_URL = typeof window !== 'undefined' && window.location.hostname === 'localhost' 
            ? 'http://localhost:3001'
            : '';

        const AppContext = createContext();

        function LoginScreen({ onLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    const response = await fetch(`${API_URL}/api/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    if (response.ok) {
                        const user = await response.json();
                        onLogin(user);
                    } else {
                        setError('Email o contraseña inválida');
                    }
                } catch (err) {
                    setError('Error al autenticarse');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="login-screen">
                    <div className="login-card">
                        <h1>GMAO</h1>
                        <p>Sistema de Gestión de Órdenes de Trabajo</p>

                        <form onSubmit={handleLogin}>
                            <div className="form-group">
                                <label>📧 Email</label>
                                <input
                                    type="email"
                                    placeholder="usuario@empresa.com"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    autoFocus
                                />
                            </div>

                            <div className="form-group">
                                <label>🔐 Contraseña</label>
                                <input
                                    type="password"
                                    placeholder="Tu contraseña"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                />
                            </div>

                            {error && <div className="error-message">❌ {error}</div>}

                            <button type="submit" className="login-btn" disabled={loading}>
                                {loading ? 'Accediendo...' : 'Acceder'}
                            </button>
                        </form>

                        <div className="credentials-info">
                            <p><strong>Usuarios de prueba:</strong></p>
                            <div className="credentials-list">
                                <p>👤 admin@gmao.com / admin123</p>
                                <p>👤 supervisor@gmao.com / supervisor123</p>
                                <p>👤 tecnico@gmao.com / tecnico123</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ user, onLogout }) {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [clientes, setClientes] = useState([]);
            const [contratos, setContratos] = useState([]);
            const [zonas, setZonas] = useState([]);
            const [emplazamientos, setEmplazamientos] = useState([]);
            const [activos, setActivos] = useState([]);
            const [ordenes, setOrdenes] = useState([]);
            const [usuarios, setUsuarios] = useState([]);
            const [isDarkMode, setIsDarkMode] = useState(document.body.classList.contains('dark-theme'));

            useEffect(() => {
                cargarDatos();
            }, []);

            const cargarDatos = async () => {
                try {
                    const [clientesRes, contratosRes, zonasRes, emplazamientosRes, activosRes, ordenesRes, usuariosRes] = await Promise.all([
                        fetch(`${API_URL}/api/clientes`),
                        fetch(`${API_URL}/api/contratos`),
                        fetch(`${API_URL}/api/zonas`),
                        fetch(`${API_URL}/api/emplazamientos`),
                        fetch(`${API_URL}/api/activos`),
                        fetch(`${API_URL}/api/ordenes`),
                        fetch(`${API_URL}/api/usuarios`)
                    ]);

                    setClientes(await clientesRes.json());
                    setContratos(await contratosRes.json());
                    setZonas(await zonasRes.json());
                    setEmplazamientos(await emplazamientosRes.json());
                    setActivos(await activosRes.json());
                    setOrdenes(await ordenesRes.json());
                    setUsuarios(await usuariosRes.json());
                } catch (err) {
                    console.error('Error cargando datos:', err);
                }
            };

            const toggleTheme = () => {
                const newDarkMode = !isDarkMode;
                setIsDarkMode(newDarkMode);
                document.body.classList.toggle('dark-theme', newDarkMode);
                document.body.classList.toggle('light-theme', !newDarkMode);
                localStorage.setItem('gmao-theme', newDarkMode ? 'dark' : 'light');
            };

            const getTabs = () => {
                const common = [{ id: 'dashboard', label: 'Dashboard' }];

                if (user.rol === 'admin' || user.rol === 'supervisor') {
                    return [
                        ...common,
                        { id: 'ordenes', label: 'Órdenes' },
                        { id: 'activos', label: 'Activos' },
                        { id: 'emplazamientos', label: 'Emplazam.' },
                        { id: 'zonas', label: 'Zonas' },
                        { id: 'contratos', label: 'Contratos' },
                        { id: 'clientes', label: 'Clientes' },
                        { id: 'usuarios', label: 'Usuarios' }
                    ];
                } else {
                    return [{ id: 'ordenes', label: 'Mis Órdenes' }];
                }
            };

            return (
                <div className="dashboard">
                    <div className="header">
                        <div className="header-top">
                            <div className="header-left">
                                <div className="header-logo">G</div>
                                <div className="header-user">
                                    <h2>{user.nombre}</h2>
                                    <p>📍 {user.rol}</p>
                                </div>
                            </div>

                            <div className="header-right">
                                <button className="theme-toggle" onClick={toggleTheme}>
                                    {isDarkMode ? '☀️ Claro' : '🌙 Oscuro'}
                                </button>
                                <button className="logout-btn" onClick={onLogout}>Salir</button>
                            </div>
                        </div>

                        <div className="nav-tabs">
                            {getTabs().map(tab => (
                                <button
                                    key={tab.id}
                                    className={`nav-btn ${activeTab === tab.id ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab.id)}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="content">
                        {activeTab === 'dashboard' && <DashboardView ordenes={ordenes} clientes={clientes} activos={activos} contratos={contratos} />}
                        {activeTab === 'ordenes' && <OrdenesView user={user} ordenes={ordenes} clientes={clientes} contratos={contratos} activos={activos} onRefresh={cargarDatos} />}
                        {activeTab === 'activos' && (user.rol === 'admin' || user.rol === 'supervisor') && <ActivosView user={user} activos={activos} emplazamientos={emplazamientos} clientes={clientes} contratos={contratos} onRefresh={cargarDatos} />}
                        {activeTab === 'emplazamientos' && (user.rol === 'admin' || user.rol === 'supervisor') && <EmplazamientosView user={user} emplazamientos={emplazamientos} zonas={zonas} clientes={clientes} contratos={contratos} onRefresh={cargarDatos} />}
                        {activeTab === 'zonas' && (user.rol === 'admin' || user.rol === 'supervisor') && <ZonasView user={user} zonas={zonas} clientes={clientes} contratos={contratos} onRefresh={cargarDatos} />}
                        {activeTab === 'contratos' && (user.rol === 'admin' || user.rol === 'supervisor') && <ContratosView user={user} contratos={contratos} clientes={clientes} onRefresh={cargarDatos} />}
                        {activeTab === 'clientes' && (user.rol === 'admin' || user.rol === 'supervisor') && <ClientesView user={user} clientes={clientes} onRefresh={cargarDatos} />}
                        {activeTab === 'usuarios' && (user.rol === 'admin' || user.rol === 'supervisor') && <UsuariosView user={user} usuarios={usuarios} onRefresh={cargarDatos} />}
                    </div>
                </div>
            );
        }

        function DashboardView({ ordenes, clientes, activos, contratos }) {
            const stats = [
                { label: 'Órdenes Totales', value: ordenes.length },
                { label: 'Clientes', value: clientes.length },
                { label: 'Activos', value: activos.length },
                { label: 'Contratos', value: contratos.length }
            ];

            return (
                <div>
                    <h3 className="section-title">Dashboard</h3>
                    <div className="metrics-grid">
                        {stats.map((stat, i) => (
                            <div key={i} className="metric-card">
                                <div className="metric-label">{stat.label}</div>
                                <div className="metric-value">{stat.value}</div>
                            </div>
                        ))}
                    </div>

                    <div className="card">
                        <h4 className="card-title">📋 Últimas Órdenes</h4>
                        {ordenes.slice(0, 3).length === 0 ? (
                            <p className="card-text">No hay órdenes</p>
                        ) : (
                            ordenes.slice(0, 3).map(order => (
                                <div key={order.id} style={{ paddingBottom: '8px', borderBottom: '1px solid var(--border)' }}>
                                    <p style={{ margin: '0', fontSize: '13px', fontWeight: '600' }}>{order.id}</p>
                                    <p className="card-text">{order.titulo}</p>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        // ===== SCHEMAS DE CHECKLISTS PREVENTIVO (según tipo de Activo) =====
        const CHECKLIST_SCHEMAS = {
            'Puerta Automática': {
                sections: [
                    { type: 'fields', title: 'Datos del Equipo', fields: [
                        { key: 'telemando', label: 'Telemando', type: 'select', options: ['Sí', 'No'] },
                        { key: 'tipo_telemando', label: 'Tipo de telemando', type: 'text' },
                        { key: 'dispositivos_seguridad', label: 'Dispositivos de seguridad', type: 'select', options: ['Sí', 'No'] },
                        { key: 'tipo_dispositivo_seguridad', label: 'Tipo de dispositivo', type: 'text' },
                        { key: 'finales_carrera', label: 'Finales de carrera', type: 'select', options: ['Sí', 'No'] }
                    ]},
                    { type: 'inspection', title: 'Inspección', items: [
                        'Comprobación visual',
                        'Control de estructura y fijaciones',
                        'Verificación de correcta apertura y cierre',
                        'Comprobación de elementos de seguridad',
                        'Comprobación de fotocélulas / radar',
                        'Comprobación de finales de carrera',
                        'Engrase de guías y rodamientos',
                        'Limpieza general'
                    ]}
                ]
            },
            'Persiana Motorizada': {
                sections: [
                    { type: 'fields', title: 'Datos del Equipo', fields: [
                        { key: 'tipo_lamas', label: 'Tipo de lamas', type: 'text' },
                        { key: 'motor', label: 'Motor', type: 'text' },
                        { key: 'telemando', label: 'Telemando', type: 'select', options: ['Sí', 'No'] },
                        { key: 'finales_carrera_adicionales', label: 'Finales de carrera adicionales', type: 'select', options: ['Sí', 'No'] },
                        { key: 'detectores_presencia', label: 'Detectores de presencia', type: 'select', options: ['Sí', 'No'] },
                        { key: 'mecanismo_desbloqueo', label: 'Mecanismo desbloqueo emergencia', type: 'select', options: ['Sí', 'No'] }
                    ]},
                    { type: 'inspection', title: 'Inspección', items: [
                        'Comprobación visual',
                        'Control de estructura y fijaciones',
                        'Verificación de correcto funcionamiento',

        // ===== COMPONENTES GENÉRICOS DE CHECKLIST =====
        function InspectionTable({ items, value, onChange, readOnly }) {
            const data = value || {};
            const setItem = (item, field, val) => {
                onChange({ ...data, [item]: { ...(data[item] || {}), [field]: val } });
            };
            return (
                <div className="grid-table-wrap">
                    <table className="insp-table">
                        <thead>
                            <tr><th>Elemento</th><th>Resultado</th><th>Observaciones</th></tr>
                        </thead>
                        <tbody>
                            {items.map(item => {
                                const row = data[item] || {};
                                return (
                                    <tr key={item}>
                                        <td>{item}</td>
                                        <td>
                                            {readOnly ? (row.resultado || '—') : (
                                                <div className="insp-radio-group">
                                                    <label><input type="radio" name={item} checked={row.resultado === 'Correcto'} onChange={() => setItem(item, 'resultado', 'Correcto')} /> ✅</label>
                                                    <label><input type="radio" name={item} checked={row.resultado === 'Incorrecto'} onChange={() => setItem(item, 'resultado', 'Incorrecto')} /> ❌</label>
                                                </div>
                                            )}
                                        </td>
                                        <td>
                                            {readOnly ? (row.observaciones || '—') : (
                                                <input className="insp-obs-input" type="text" placeholder="Observaciones" value={row.observaciones || ''} onChange={(e) => setItem(item, 'observaciones', e.target.value)} />
                                            )}
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        }

        function ComponentGrid({ rows, columns, options, value, onChange, readOnly }) {
            const data = value || {};
            const setCell = (row, col, val) => {
                onChange({ ...data, [row]: { ...(data[row] || {}), [col]: val } });
            };
            return (
                <div className="grid-table-wrap">
                    <table className="grid-table">
                        <thead>
                            <tr><th></th>{columns.map(c => <th key={c}>{c}</th>)}</tr>
                        </thead>
                        <tbody>
                            {rows.map(row => (
                                <tr key={row}>
                                    <td style={{ fontWeight: 600, textAlign: 'left' }}>{row}</td>
                                    {columns.map(col => {
                                        const val = (data[row] || {})[col] || '';
                                        return (
                                            <td key={col}>
                                                {readOnly ? (val || '—') : (
                                                    <select value={val} onChange={(e) => setCell(row, col, e.target.value)}>
                                                        <option value="">-</option>
                                                        {options.map(o => <option key={o} value={o}>{o}</option>)}
                                                    </select>
                                                )}
                                            </td>
                                        );
                                    })}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function DynamicChecklistForm({ tipoActivo, value, onChange, readOnly }) {
            const schema = CHECKLIST_SCHEMAS[tipoActivo];
            const data = value || {};

            if (!schema) {
                return <p className="card-text">⚠️ No hay checklist definido para el tipo de activo "{tipoActivo}".</p>;
            }

            const updateSection = (sectionKey, sectionValue) => {
                onChange({ ...data, [sectionKey]: sectionValue });
            };

            return (
                <div>
                    {schema.sections.map((section, idx) => {
                        const sectionKey = section.key || `section_${idx}`;
                        return (
                            <div key={idx} className="checklist-section">
                                <div className="checklist-section-title">{section.title}</div>

                                {section.type === 'fields' && (
                                    <div>
                                        {section.fields.map(f => (
                                            <div className="form-group" key={f.key}>
                                                <label>{f.label}</label>
                                                {readOnly ? (
                                                    <p className="card-text">{(data[sectionKey] || {})[f.key] || '—'}</p>
                                                ) : f.type === 'select' ? (
                                                    <select value={(data[sectionKey] || {})[f.key] || ''} onChange={(e) => updateSection(sectionKey, { ...(data[sectionKey] || {}), [f.key]: e.target.value })}>
                                                        <option value="">-- Selecciona --</option>
                                                        {f.options.map(o => <option key={o} value={o}>{o}</option>)}
                                                    </select>
                                                ) : (
                                                    <input type="text" value={(data[sectionKey] || {})[f.key] || ''} onChange={(e) => updateSection(sectionKey, { ...(data[sectionKey] || {}), [f.key]: e.target.value })} />
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {section.type === 'inspection' && (
                                    <InspectionTable items={section.items} value={data[sectionKey]} onChange={(v) => updateSection(sectionKey, v)} readOnly={readOnly} />
                                )}

                                {section.type === 'grid' && (
                                    <ComponentGrid rows={section.rows} columns={section.columns} options={section.options} value={data[sectionKey]} onChange={(v) => updateSection(sectionKey, v)} readOnly={readOnly} />
                                )}

                                {section.type === 'textarea' && (
                                    readOnly ? (
                                        <p className="card-text">{data[section.key] || '—'}</p>
                                    ) : (
                                        <textarea value={data[section.key] || ''} onChange={(e) => onChange({ ...data, [section.key]: e.target.value })}></textarea>
                                    )
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        }

        // ===== PARTE DE TRABAJO (para OT tipo Obra) =====
        function ParteTrabajoForm({ value, onChange, readOnly }) {
            const data = value || {};
            const trabajos = data.trabajos || [{ descripcion: '', horario: '', finalizado: 'NO', detalle: '' }];
            const materiales = data.materiales || [{ proyecto: '', cantidad: '', descripcion: '' }];
            const medioAmbiente = data.medioAmbiente || [{ tipoResiduo: '', cantidad: '', destino: '' }];
            const desplazamientos = data.desplazamientos || [{ matricula: '', origen: '', destino: '', kilometros: '' }];
            const seguridad = data.seguridad || { epis: '', maquinariaBuenEstado: '', mediosElevacion: '', mediosElevacionTipo: '' };

            const updateArray = (key, arr) => onChange({ ...data, [key]: arr });
            const updateArrayItem = (key, idx, field, val) => {
                const arr = [...(data[key] || [])];
                arr[idx] = { ...arr[idx], [field]: val };
                updateArray(key, arr);
            };
            const addRow = (key, empty) => updateArray(key, [...(data[key] || [empty]), empty]);
            const removeRow = (key, idx) => {
                const arr = [...(data[key] || [])];
                arr.splice(idx, 1);
                updateArray(key, arr);
            };

            return (
                <div>
                    <div className="checklist-section">
                        <div className="checklist-section-title">📋 Trabajos Realizados</div>
                        {trabajos.map((t, i) => (
                            <div key={i} className="dyn-row">
                                <input placeholder="Descripción / Nº Proyecto" value={t.descripcion} disabled={readOnly} onChange={(e) => updateArrayItem('trabajos', i, 'descripcion', e.target.value)} />
                                <input placeholder="Horario" value={t.horario} disabled={readOnly} onChange={(e) => updateArrayItem('trabajos', i, 'horario', e.target.value)} />
                                <select value={t.finalizado} disabled={readOnly} onChange={(e) => updateArrayItem('trabajos', i, 'finalizado', e.target.value)}>
                                    <option value="NO">Finalizado: NO</option>
                                    <option value="SI">Finalizado: SI</option>
                                </select>
                                <textarea placeholder="Descripción de los trabajos realizados" value={t.detalle} disabled={readOnly} onChange={(e) => updateArrayItem('trabajos', i, 'detalle', e.target.value)}></textarea>
                                {!readOnly && trabajos.length > 1 && <div className="dyn-row-actions"><button className="btn-remove-row" onClick={() => removeRow('trabajos', i)}>Quitar</button></div>}
                            </div>
                        ))}
                        {!readOnly && <button className="btn-add-row" onClick={() => addRow('trabajos', { descripcion: '', horario: '', finalizado: 'NO', detalle: '' })}>+ Añadir trabajo</button>}
                    </div>

                    <div className="checklist-section">
                        <div className="checklist-section-title">📦 Materiales</div>
                        {materiales.map((m, i) => (
                            <div key={i} className="dyn-row">
                                <input placeholder="Nº Proyecto" value={m.proyecto} disabled={readOnly} onChange={(e) => updateArrayItem('materiales', i, 'proyecto', e.target.value)} />
                                <input placeholder="Cantidad" value={m.cantidad} disabled={readOnly} onChange={(e) => updateArrayItem('materiales', i, 'cantidad', e.target.value)} />
                                <input placeholder="Descripción" value={m.descripcion} disabled={readOnly} onChange={(e) => updateArrayItem('materiales', i, 'descripcion', e.target.value)} />
                                {!readOnly && materiales.length > 1 && <div className="dyn-row-actions"><button className="btn-remove-row" onClick={() => removeRow('materiales', i)}>Quitar</button></div>}
                            </div>
                        ))}
                        {!readOnly && <button className="btn-add-row" onClick={() => addRow('materiales', { proyecto: '', cantidad: '', descripcion: '' })}>+ Añadir material</button>}
                    </div>

                    <div className="checklist-section">
                        <div className="checklist-section-title">🌱 Medio Ambiente</div>
                        {medioAmbiente.map((r, i) => (
                            <div key={i} className="dyn-row">
                                <input placeholder="Tipo de Residuo" value={r.tipoResiduo} disabled={readOnly} onChange={(e) => updateArrayItem('medioAmbiente', i, 'tipoResiduo', e.target.value)} />
                                <input placeholder="Cantidad" value={r.cantidad} disabled={readOnly} onChange={(e) => updateArrayItem('medioAmbiente', i, 'cantidad', e.target.value)} />
                                <input placeholder="Destino del residuo" value={r.destino} disabled={readOnly} onChange={(e) => updateArrayItem('medioAmbiente', i, 'destino', e.target.value)} />
                                {!readOnly && medioAmbiente.length > 1 && <div className="dyn-row-actions"><button className="btn-remove-row" onClick={() => removeRow('medioAmbiente', i)}>Quitar</button></div>}
                            </div>
                        ))}
                        {!readOnly && <button className="btn-add-row" onClick={() => addRow('medioAmbiente', { tipoResiduo: '', cantidad: '', destino: '' })}>+ Añadir residuo</button>}
                    </div>

                    <div className="checklist-section">
                        <div className="checklist-section-title">🦺 Seguridad y Salud</div>
                        <div className="form-group">
                            <label>¿Se utilizaron EPIs para realizar los trabajos?</label>
                            <select value={seguridad.epis} disabled={readOnly} onChange={(e) => onChange({ ...data, seguridad: { ...seguridad, epis: e.target.value } })}>
                                <option value="">-- Selecciona --</option>
                                <option value="SI">SI</option>
                                <option value="NO">NO</option>
                            </select>
                        </div>
                        <div className="form-group">
                            <label>¿La maquinaria y equipos se encontraban en buen estado?</label>
                            <select value={seguridad.maquinariaBuenEstado} disabled={readOnly} onChange={(e) => onChange({ ...data, seguridad: { ...seguridad, maquinariaBuenEstado: e.target.value } })}>
                                <option value="">-- Selecciona --</option>
                                <option value="SI">SI</option>
                                <option value="NO">NO</option>
                            </select>
                        </div>
                        <div className="form-group">
                            <label>¿Han sido necesarios medios de elevación?</label>
                            <select value={seguridad.mediosElevacion} disabled={readOnly} onChange={(e) => onChange({ ...data, seguridad: { ...seguridad, mediosElevacion: e.target.value } })}>
                                <option value="">-- Selecciona --</option>
                                <option value="SI">SI</option>
                                <option value="NO">NO</option>
                            </select>
                        </div>
                        {seguridad.mediosElevacion === 'SI' && (
                            <div className="form-group">
                                <label>Medios de elevación utilizados</label>
                                <input type="text" value={seguridad.mediosElevacionTipo} disabled={readOnly} onChange={(e) => onChange({ ...data, seguridad: { ...seguridad, mediosElevacionTipo: e.target.value } })} />
                            </div>
                        )}
                    </div>

                    <div className="checklist-section">
                        <div className="checklist-section-title">🚗 Desplazamientos</div>
                        {desplazamientos.map((d, i) => (
                            <div key={i} className="dyn-row">
                                <input placeholder="Matrícula" value={d.matricula} disabled={readOnly} onChange={(e) => updateArrayItem('desplazamientos', i, 'matricula', e.target.value)} />
                                <input placeholder="Origen" value={d.origen} disabled={readOnly} onChange={(e) => updateArrayItem('desplazamientos', i, 'origen', e.target.value)} />
                                <input placeholder="Destino" value={d.destino} disabled={readOnly} onChange={(e) => updateArrayItem('desplazamientos', i, 'destino', e.target.value)} />
                                <input placeholder="Total Kilómetros" value={d.kilometros} disabled={readOnly} onChange={(e) => updateArrayItem('desplazamientos', i, 'kilometros', e.target.value)} />
                                {!readOnly && desplazamientos.length > 1 && <div className="dyn-row-actions"><button className="btn-remove-row" onClick={() => removeRow('desplazamientos', i)}>Quitar</button></div>}
                            </div>
                        ))}
                        {!readOnly && <button className="btn-add-row" onClick={() => addRow('desplazamientos', { matricula: '', origen: '', destino: '', kilometros: '' })}>+ Añadir desplazamiento</button>}
                    </div>
                </div>
            );

        function OrdenesView({ user, ordenes, clientes, contratos, activos, onRefresh }) {
            const esGestor = user.rol === 'admin' || user.rol === 'supervisor';
            const [showForm, setShowForm] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [viewingId, setViewingId] = useState(null);
            const [filtroTipo, setFiltroTipo] = useState('todas');
            const [selectedCliente, setSelectedCliente] = useState('');
            const [activoSearch, setActivoSearch] = useState('');

            const initialForm = {
                titulo: '', tipo: esGestor ? 'correctivo' : 'guardia',
                cliente_id: '', estado: 'abierta', notas: '',
                activo_id: '', datos_json: {}
            };
            const [formData, setFormData] = useState(initialForm);

            const contratosFiltrados = selectedCliente ? contratos.filter(c => c.cliente_id === parseInt(selectedCliente)) : contratos;
            const activosFiltrados = activoSearch ? activos.filter(a => a.nombre.toLowerCase().includes(activoSearch.toLowerCase())) : activos;
            const activoSeleccionado = activos.find(a => a.id === parseInt(formData.activo_id));

            const resetForm = () => {
                setFormData(initialForm);
                setSelectedCliente('');
                setActivoSearch('');
                setEditingId(null);
                setShowForm(false);
            };

            const handleSubmit = async () => {
                if (!formData.titulo.trim()) { alert('El título es obligatorio'); return; }
                if (formData.tipo === 'preventivo' && !formData.activo_id) { alert('Selecciona el activo a revisar'); return; }

                const payload = {
                    ...formData,
                    cliente_id: formData.cliente_id || null,
                    activo_id: formData.activo_id || null,
                    asignado_a: user.id,
                    datos_json: JSON.stringify(formData.datos_json || {})
                };

                try {
                    const url = editingId ? `${API_URL}/api/ordenes/${editingId}` : `${API_URL}/api/ordenes`;
                    const method = editingId ? 'PUT' : 'POST';
                    await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    resetForm();
                    onRefresh();
                } catch (err) {
                    alert('Error al guardar la orden');
                }
            };

            const handleDelete = async (id) => {
                if (!confirm('¿Eliminar esta orden?')) return;
                await fetch(`${API_URL}/api/ordenes/${id}`, { method: 'DELETE' });
                onRefresh();
            };

            const handleEdit = (o) => {
                let datos = {};
                try { datos = o.datos_json ? JSON.parse(o.datos_json) : {}; } catch { datos = {}; }
                setFormData({
                    titulo: o.titulo, tipo: o.tipo, cliente_id: o.cliente_id || '',
                    estado: o.estado, notas: o.notas || '', activo_id: o.activo_id || '', datos_json: datos
                });
                if (o.cliente_id) setSelectedCliente(String(o.cliente_id));
                setEditingId(o.id);
                setShowForm(true);
                setViewingId(null);
            };

            const handleConvertirGuardia = async (o) => {
                const clienteId = prompt('Introduce el ID del cliente para convertir esta guardia en Correctivo.\n\nClientes disponibles:\n' + clientes.map(c => `${c.id} - ${c.nombre}`).join('\n'));
                if (!clienteId) return;
                await fetch(`${API_URL}/api/ordenes/${o.id}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...o, tipo: 'correctivo', cliente_id: parseInt(clienteId), estado: 'abierta' })
                });
                onRefresh();
            };

            const ordenesFiltradas = filtroTipo === 'todas' ? ordenes : ordenes.filter(o => o.tipo === filtroTipo);
            const ordenVista = viewingId ? ordenes.find(o => o.id === viewingId) : null;
            let datosVista = {};
            if (ordenVista) { try { datosVista = ordenVista.datos_json ? JSON.parse(ordenVista.datos_json) : {}; } catch { datosVista = {}; } }

            return (
                <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', flexWrap: 'wrap', gap: '8px' }}>
                        <h3 className="section-title" style={{ margin: 0 }}>📋 {esGestor ? 'Órdenes de Trabajo' : 'Mis Órdenes'}</h3>
                        <button className="btn btn-primary" onClick={() => { setShowForm(!showForm); if (showForm) resetForm(); }}>
                            + Nueva {!esGestor && 'Guardia'}
                        </button>
                    </div>

                    <div className="tipo-filter-bar">
                        {['todas', 'correctivo', 'preventivo', 'obra', 'guardia'].map(t => (
                            <button key={t} className={`tipo-filter-btn ${filtroTipo === t ? 'active' : ''}`} onClick={() => setFiltroTipo(t)}>
                                {t === 'todas' ? 'Todas' : t.charAt(0).toUpperCase() + t.slice(1)}
                            </button>
                        ))}
                    </div>

                    {showForm && (
                        <div className="card" style={{ marginBottom: '1rem' }}>
                            <div className="form-group">
                                <label>Título</label>
                                <input type="text" placeholder="Título de la orden" value={formData.titulo} onChange={(e) => setFormData({ ...formData, titulo: e.target.value })} />
                            </div>

                            {esGestor && (
                                <div className="form-group">
                                    <label>Tipo</label>
                                    <select value={formData.tipo} onChange={(e) => setFormData({ ...formData, tipo: e.target.value, activo_id: '', datos_json: {} })}>
                                        <option value="correctivo">Correctiva</option>
                                        <option value="preventivo">Preventiva</option>
                                        <option value="obra">Obra</option>
                                        <option value="guardia">Guardia</option>
                                    </select>
                                </div>
                            )}
                            {!esGestor && (
                                <p className="card-text">🔔 Como técnico, tus órdenes se crean como <strong>Guardia</strong>. Un supervisor las revisará y convertirá en Correctivo si procede.</p>
                            )}

                            {formData.tipo !== 'guardia' && (
                                <div className="form-group">
                                    <label>Cliente</label>
                                    <select value={formData.cliente_id} onChange={(e) => setFormData({ ...formData, cliente_id: e.target.value })}>
                                        <option value="">-- Selecciona un cliente --</option>
                                        {clientes.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                                    </select>
                                </div>
                            )}

                            {formData.tipo === 'preventivo' && (
                                <>
                                    <div className="form-group">
                                        <label>Filtrar por Cliente (opcional)</label>
                                        <select value={selectedCliente} onChange={(e) => setSelectedCliente(e.target.value)}>
                                            <option value="">-- Todos --</option>
                                            {clientes.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label>Buscar Activo</label>
                                        <input type="text" placeholder="Escribe para filtrar..." value={activoSearch} onChange={(e) => setActivoSearch(e.target.value)} />
                                    </div>
                                    <div className="form-group">
                                        <label>Activo a Revisar</label>
                                        <select value={formData.activo_id} onChange={(e) => setFormData({ ...formData, activo_id: e.target.value, datos_json: {} })}>
                                            <option value="">-- Selecciona un activo --</option>
                                            {activosFiltrados.map(a => (
                                                <option key={a.id} value={a.id}>{a.nombre} · {a.tipo} ({a.cliente_nombre} › {a.emplazamiento_nombre})</option>
                                            ))}
                                        </select>
                                    </div>

        // ===== HELPERS EXCEL (SheetJS) =====
        function exportToExcel(data, filename, columns) {
            if (!data || data.length === 0) {
                alert('No hay datos para exportar');
                return;
            }
            const rows = data.map(item => {
                const row = {};
                columns.forEach(col => { row[col.label] = item[col.key] ?? ''; });
                return row;
            });
            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Datos');
            XLSX.writeFile(wb, `${filename}.xlsx`);
        }

        function ExcelImportButton({ onRows, label }) {
            const inputRef = React.useRef(null);
            const handleFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
                    onRows(rows);
                };
                reader.readAsBinaryString(file);
                e.target.value = '';
            };
            return (
                <label className="btn btn-import" style={{ cursor: 'pointer' }}>
                    📥 {label || 'Importar Excel'}
                    <input ref={inputRef} type="file" accept=".xlsx,.xls" className="file-input-hidden" onChange={handleFile} />
                </label>
            );
        }

        function ContratosView({ user, contratos, clientes, onRefresh }) {
            const [showForm, setShowForm] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                cliente_id: clientes.length > 0 ? clientes[0].id : 1,
                nombre: '',
                descripcion: '',
                fecha_inicio: '',
                fecha_fin: '',
                estado: 'Activo'
            });

            const handleAdd = async () => {
                if (!formData.nombre.trim()) return;

                try {
                    const url = editingId ? `${API_URL}/api/contratos/${editingId}` : `${API_URL}/api/contratos`;
                    const method = editingId ? 'PUT' : 'POST';

                    await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    setFormData({
                        cliente_id: clientes[0]?.id || 1,
                        nombre: '',
                        descripcion: '',
                        fecha_inicio: '',
                        fecha_fin: '',
                        estado: 'Activo'
                    });
                    setEditingId(null);
                    setShowForm(false);
                    onRefresh();
                } catch (err) {
                    alert('Error al guardar contrato');
                }
            };

            const handleDelete = async (id) => {
                if (!confirm('¿Eliminar este contrato?')) return;

                try {
                    await fetch(`${API_URL}/api/contratos/${id}`, { method: 'DELETE' });
                    onRefresh();
                } catch (err) {
                    alert('Error al eliminar contrato');
                }
            };

            const handleEdit = (contrato) => {
                setFormData(contrato);
                setEditingId(contrato.id);
                setShowForm(true);
            };

            const [importMsg, setImportMsg] = useState('');
            const handleImportRows = async (rows) => {
                let ok = 0, fail = 0;
                for (const row of rows) {
                    const clienteNombre = row['Cliente'] || row['cliente'];
                    const nombre = row['Contrato'] || row['nombre'] || row['Nombre'];
                    const cliente = clientes.find(c => c.nombre === clienteNombre);
                    if (!cliente || !nombre) { fail++; continue; }
                    try {
                        await fetch(`${API_URL}/api/contratos`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                cliente_id: cliente.id, nombre,
                                descripcion: row['Descripción'] || row['descripcion'] || '',
                                fecha_inicio: row['Fecha Inicio'] || row['fecha_inicio'] || '',
                                fecha_fin: row['Fecha Fin'] || row['fecha_fin'] || '',
                                estado: row['Estado'] || row['estado'] || 'Activo'
                            })
                        });
                        ok++;
                    } catch { fail++; }
                }
                setImportMsg(`✅ Importados: ${ok} | ❌ Fallidos: ${fail}`);
                onRefresh();

                                { key: 'descripcion', label: 'Descripción' },
                                { key: 'fecha_inicio', label: 'Fecha Inicio' },
                                { key: 'fecha_fin', label: 'Fecha Fin' },
                                { key: 'estado', label: 'Estado' }

                            <ExcelImportButton onRows={handleImportRows} />

                                + Nuevo
                            </button>

                    {importMsg && <div className="import-summary">{importMsg}</div>}

                    {showForm && (

                            </div>
                            <div className="form-group">
                                <label>Fecha Inicio</label>
                                <input type="date" value={formData.fecha_inicio} onChange={(e) => setFormData({ ...formData, fecha_inicio: e.target.value })} />

        function UsuariosView({ user, usuarios, onRefresh }) {
            const [showForm, setShowForm] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                nombre: '',
                email: '',
                password: '',
                rol: 'tecnico',
                activo: 1
            });
            const [error, setError] = useState('');

            const handleAdd = async () => {
                setError('');
                
                if (!formData.nombre.trim() || !formData.email.trim()) {
                    setError('Nombre y email requeridos');
                    return;
                }

                if (!editingId && !formData.password.trim()) {
                    setError('Contraseña requerida para nuevo usuario');
                    return;
                }

                if (formData.password && formData.password.length < 6) {
                    setError('La contraseña debe tener al menos 6 caracteres');
                    return;
                }

                // Supervisor no puede crear admin
                if (user.rol === 'supervisor' && formData.rol === 'admin') {
                    setError('Supervisor no puede crear administradores');
                    return;
                }

                try {
                    const url = editingId ? `${API_URL}/api/usuarios/${editingId}` : `${API_URL}/api/usuarios`;
                    const method = editingId ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        setFormData({ nombre: '', email: '', password: '', rol: 'tecnico', activo: 1 });
                        setEditingId(null);
                        setShowForm(false);
                        onRefresh();
                    } else {
                        const data = await response.json();
                        setError(data.error || 'Error al guardar usuario');
                    }
                } catch (err) {
                    setError('Error al guardar usuario');
                }
            };

            const handleDelete = async (id) => {
                if (!confirm('¿Eliminar este usuario?')) return;

                try {
                    await fetch(`${API_URL}/api/usuarios/${id}`, { method: 'DELETE' });
                    onRefresh();
                } catch (err) {
                    alert('Error al eliminar usuario');
                }
            };

            const handleEdit = (u) => {
                setFormData({ ...u, password: '' });
                setEditingId(u.id);
                setShowForm(true);
            };

            const handleDisable = async (id) => {
                try {
                    await fetch(`${API_URL}/api/usuarios/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...usuarios.find(u => u.id === id), activo: 0 })
                    });
                    onRefresh();
                } catch (err) {
                    alert('Error al inhabilitar usuario');
                }
            };

            return (
                <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
                        <h3 className="section-title" style={{ margin: 0 }}>👥 Usuarios</h3>
                        <button className="btn btn-primary" onClick={() => { setShowForm(!showForm); setEditingId(null); setError(''); }}>
                            + Nuevo
                        </button>
                    </div>

                    {showForm && (
                        <div className="card" style={{ marginBottom: '1rem' }}>
                            <div className="form-group">
                                <label>Nombre</label>
                                <input type="text" placeholder="Nombre completo" value={formData.nombre} onChange={(e) => setFormData({ ...formData, nombre: e.target.value })} />
                            </div>

                            <div className="form-group">
                                <label>Email</label>
                                <input type="email" placeholder="usuario@ejemplo.com" value={formData.email} onChange={(e) => setFormData({ ...formData, email: e.target.value })} />
                            </div>

                            {!editingId && (
                                <div className="form-group">
                                    <label>Contraseña</label>
                                    <input type="password" placeholder="Mínimo 6 caracteres" value={formData.password} onChange={(e) => setFormData({ ...formData, password: e.target.value })} />
                                </div>
                            )}

                            {editingId && (
                                <div className="form-group">

                                </div>
                            )}

                            <div className="form-group">
                                <label>Rol</label>

                                    {user.rol === 'admin' && <option value="admin">Administrador</option>}

                                    <option value="tecnico">Técnico</option>
                                </select>
                            </div>

                            {error && <p style={{ color: 'var(--fill-danger)', fontSize: '12px', marginBottom: '12px' }}>❌ {error}</p>}

                            <div className="btn-group">
                                <button className="btn btn-success" onClick={handleAdd}>{editingId ? 'Guardar' : 'Crear'}</button>

                            </div>
                        </div>
                    )}

                    <div className="list">
                        {usuarios.length === 0 ? (
                            <div className="empty-state">No hay usuarios</div>
                        ) : (
                            usuarios.map(u => (
                                <div key={u.id} className="list-item" style={{ opacity: u.activo ? 1 : 0.5 }}>

                                            <p className="card-text">📧 {u.email}</p>
                                        </div>
                                        <span className={`badge ${u.rol}`}>{u.rol}</span>
                                    </div>
                                    <p className="card-text">✓ Estado: {u.activo ? 'Activo' : 'Inactivo'}</p>
                                    <div style={{ marginTop: '8px', display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                                        <button className="btn btn-primary" onClick={() => handleEdit(u)}>Editar</button>

                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

            }, []);

            return user ? (
                <Dashboard user={user} onLogout={() => setUser(null)} />
            ) : (
                <LoginScreen onLogin={setUser} />
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
